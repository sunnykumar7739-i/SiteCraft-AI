<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="SiteCraft AI buddy logo" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- background disc -->
    <radialGradient id="bg" cx="35%" cy="25%" r="90%">
      <stop offset="0%" stop-color="#4a2e1c"/>
      <stop offset="55%" stop-color="#2c1810"/>
      <stop offset="100%" stop-color="#150c07"/>
    </radialGradient>
    <!-- gold ring -->
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6d98a"/>
      <stop offset="45%" stop-color="#e3b341"/>
      <stop offset="100%" stop-color="#9c6a23"/>
    </linearGradient>
    <!-- head: cream to warm sand -->
    <linearGradient id="head" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff8ea"/>
      <stop offset="100%" stop-color="#eacfa3"/>
    </linearGradient>
    <!-- visor: deep cocoa glass -->
    <linearGradient id="visor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a2416"/>
      <stop offset="100%" stop-color="#1b0f09"/>
    </linearGradient>
    <!-- eyes: gold glow -->
    <linearGradient id="eye" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe9a8"/>
      <stop offset="100%" stop-color="#e3b341"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd978" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffd978" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- disc + ring -->
  <circle cx="128" cy="128" r="124" fill="url(#ring)"/>
  <circle cx="128" cy="128" r="117" fill="url(#bg)"/>
  <circle cx="128" cy="128" r="117" fill="none" stroke="#000" stroke-opacity="0.25" stroke-width="1"/>

  <!-- antenna -->
  <circle cx="128" cy="52" r="16" fill="url(#glow)" filter="url(#soft)"/>
  <rect x="124" y="56" width="8" height="22" rx="4" fill="url(#ring)"/>
  <circle cx="128" cy="52" r="8" fill="url(#eye)"/>
  <circle cx="125.5" cy="49.5" r="2.5" fill="#fff" fill-opacity="0.85"/>

  <!-- ears -->
  <rect x="42" y="112" width="16" height="40" rx="8" fill="url(#ring)"/>
  <rect x="198" y="112" width="16" height="40" rx="8" fill="url(#ring)"/>

  <!-- head -->
  <g filter="url(#shadow)">
    <rect x="56" y="76" width="144" height="118" rx="40" fill="url(#head)"/>
  </g>
  <!-- head gloss -->
  <path d="M72 96 Q128 70 184 96 L184 104 Q128 86 72 104 Z" fill="url(#gloss)"/>

  <!-- visor -->
  <rect x="74" y="100" width="108" height="56" rx="28" fill="url(#visor)"/>
  <rect x="74" y="100" width="108" height="56" rx="28" fill="none" stroke="url(#ring)" stroke-width="2"/>

  <!-- eyes -->
  <g>
    <ellipse cx="105" cy="128" rx="14" ry="12" fill="url(#glow)" filter="url(#soft)"/>
    <ellipse cx="151" cy="128" rx="14" ry="12" fill="url(#glow)" filter="url(#soft)"/>
    <rect x="94" y="118" width="22" height="20" rx="10" fill="url(#eye)"/>
    <rect x="140" y="118" width="22" height="20" rx="10" fill="url(#eye)"/>
    <circle cx="100" cy="123" r="3" fill="#fff" fill-opacity="0.9"/>
    <circle cx="146" cy="123" r="3" fill="#fff" fill-opacity="0.9"/>
  </g>

  <!-- smile -->
  <path d="M108 170 Q128 184 148 170" fill="none" stroke="#a85e2c" stroke-width="5" stroke-linecap="round"/>

  <!-- sparkle -->
  <path d="M196 70 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z" fill="#ffe9a8"/>
  <path d="M60 196 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2z" fill="#ffe9a8" fill-opacity="0.8"/>
</svg>
